<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saving Carbon Town — Family Feud</title>
<style>
  :root{
    --bg:#0a1929;--panel:#0b2035;
    --blue:#1b4f7e;--blue2:#0e3357;--blue-border:#2a6aa0;
    --gold:#f5c542;--gold2:#d9a800;
    --teal:#22d3a8;--teal2:#0e8f73;
    --txt:#eaf4ff;--muted:#7fa6c4;--line:#1d4368;
    --red:#ef4444;--red2:#b91c1c;
    --green:#4ade80;--green2:#16a34a;
    --team1:#3b82f6;--team2:#e0479b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(120% 120% at 50% -10%,#143657 0%,var(--bg) 55%,#05101c 100%);color:var(--txt);min-height:100%;-webkit-font-smoothing:antialiased;}
  button{font:inherit;cursor:pointer;}
  .screen{display:none;} .screen.active{display:block;} #gameScreen.active{display:flex;flex-direction:column;min-height:100vh;}

  /* ── MENU ── */
  #menuScreen{max-width:1100px;margin:0 auto;padding:44px 20px 60px;}
  .mhead{text-align:center;margin-bottom:36px;}
  .kicker{display:block;letter-spacing:.3em;font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;margin-bottom:10px;}
  .mhead h1{font-size:clamp(28px,5vw,52px);font-weight:900;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px;}
  .mhead p{color:var(--muted);font-size:14px;}
  .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:28px;}
  .gcard{background:linear-gradient(180deg,#103a5f,#0c2742);border:1px solid var(--line);border-radius:16px;padding:20px 22px;cursor:pointer;position:relative;overflow:hidden;transition:transform .1s,box-shadow .15s;}
  .gcard::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--c,var(--teal));}
  .gcard:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(0,0,0,.45);}
  .gcard .gn{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .gcard h2{font-size:19px;font-weight:900;margin-bottom:5px;}
  .gcard p{font-size:13px;color:var(--muted);line-height:1.5;}
  .gcard .qc{margin-top:10px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--teal));}

  /* ── GAME HEADER ── */
  .ghdr{background:#06192b;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .ghdr .gtitle{font-weight:900;font-size:17px;}
  .ghdr .grnd{font-size:13px;color:var(--muted);font-weight:600;}
  .btn-back{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-weight:700;font-size:13px;}
  .btn-back:hover{background:#0e2c47;color:var(--txt);}

  /* ── GAME BODY ── */
  .gbody{flex:1;display:grid;grid-template-columns:180px 1fr 180px;padding:14px 14px 0;max-width:1280px;margin:0 auto;width:100%;align-items:start;}

  /* ── TEAM PANELS ── */
  .tp{background:linear-gradient(180deg,#103a5f,#0c2742);border:2px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;position:sticky;top:14px;transition:border-color .2s,box-shadow .2s;}
  .tp.t1-active{border-color:var(--team1);box-shadow:0 0 0 3px rgba(59,130,246,.25);}
  .tp.t2-active{border-color:var(--team2);box-shadow:0 0 0 3px rgba(224,71,155,.25);}
  .tlbl{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
  .tname{font-size:13px;font-weight:900;color:var(--txt);display:block;outline:none;border-radius:6px;padding:3px 4px;text-align:center;margin-bottom:8px;}
  .tname:focus{background:#0e2c47;box-shadow:0 0 0 2px var(--teal);}
  .tscore{font-size:40px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
  .t1score{color:var(--team1);}
  .t2score{color:var(--team2);}
  .trnd{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px;}
  .tbadge{display:none;margin-top:8px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:99px;}
  .tp.t1-active .b1{display:block;background:rgba(59,130,246,.2);color:var(--team1);}
  .tp.t2-active .b2{display:block;background:rgba(224,71,155,.2);color:var(--team2);}

  /* ── CENTER ── */
  .center{padding:0 12px;display:flex;flex-direction:column;gap:12px;}
  .qbox{background:linear-gradient(180deg,var(--blue),var(--blue2));border:1px solid var(--blue-border);border-radius:14px;padding:16px 20px;text-align:center;}
  .qbox .qlbl{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
  .qbox .qtxt{font-size:clamp(16px,2.3vw,24px);font-weight:800;line-height:1.4;color:#dff1ff;}

  /* ── INPUT AREA ── */
  .input-area{background:#07202f;border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
  .input-label{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px;text-align:center;}
  .input-label span{font-size:14px;font-weight:900;letter-spacing:0;text-transform:none;}
  .input-row{display:flex;gap:8px;}
  .input-row input{
    flex:1;background:#0b2035;border:2px solid var(--line);border-radius:10px;
    color:var(--txt);font:inherit;font-size:16px;font-weight:700;padding:10px 14px;outline:none;
    transition:border-color .15s;
  }
  .input-row input:focus{border-color:var(--teal);}
  .input-row input.wrong-shake{animation:shake .3s ease;border-color:var(--red);}
  .input-row input.right-flash{border-color:var(--green);}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .submit-btn{background:linear-gradient(180deg,#ffe28a,var(--gold));color:#06202f;border:none;border-radius:10px;padding:10px 18px;font-weight:800;font-size:14px;box-shadow:0 2px 0 var(--gold2);}
  .submit-btn:hover{filter:brightness(1.06);}
  .submit-btn:active{transform:translateY(1px);box-shadow:none;}
  .feedback{min-height:22px;text-align:center;font-size:13px;font-weight:700;margin-top:8px;transition:opacity .2s;}
  .feedback.match{color:var(--green);}
  .feedback.miss{color:var(--red);}

  /* ── BOARD ── */
  .board{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .tw{perspective:700px;height:72px;}
  .ti{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);}
  .tw.revealed .ti{transform:rotateX(180deg);}
  .tf,.tb{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;}
  .tf{background:linear-gradient(180deg,var(--blue),var(--blue2));border:1px solid var(--blue-border);font-size:24px;color:var(--gold);cursor:default;}
  .tb{background:linear-gradient(180deg,#c97010,#9a5108);border:1px solid #f59e0b;transform:rotateX(180deg);flex-direction:column;gap:1px;padding:6px 10px;text-align:center;position:relative;}
  .tb .atxt{font-size:clamp(11px,1.5vw,14px);color:#fff;font-weight:800;line-height:1.2;}
  .tb .apts{font-size:20px;font-weight:900;color:#fef3c7;}
  .tb .owner-tag{position:absolute;top:3px;right:5px;font-size:9px;font-weight:900;letter-spacing:.06em;padding:1px 5px;border-radius:99px;}
  .tb .owner-t1{background:rgba(59,130,246,.3);color:#93c5fd;}
  .tb .owner-t2{background:rgba(224,71,155,.3);color:#f9a8d4;}
  .tw.no-owner .tb{background:linear-gradient(180deg,#2a4a2a,#1a3a1a);border-color:#4ade80;}

  /* ── STRIKES ── */
  .strikes-row{display:flex;align-items:center;justify-content:center;gap:12px;}
  .slbl{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);}
  .smarks{display:flex;gap:8px;}
  .sm{width:42px;height:42px;border-radius:50%;border:2px solid #1e4d77;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:transparent;transition:all .2s;}
  .sm.hit{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.15);animation:shk .35s ease;}
  @keyframes shk{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}

  /* ── HOST KEY ── */
  .host-key{background:#041522;border:1px solid #0e3357;border-radius:12px;overflow:hidden;}
  .hk-toggle{width:100%;background:transparent;border:none;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;}
  .hk-toggle:hover{background:#06192b;color:var(--txt);}
  .hk-body{display:none;padding:10px 14px 12px;border-top:1px solid #0e3357;}
  .hk-body.open{display:block;}
  .hk-metric{font-size:11px;color:#f59e0b;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #1a3a1a;letter-spacing:.02em;}
  .hk-row{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;border-bottom:1px solid #0e2a3f;font-size:13px;gap:8px;}
  .hk-row:last-child{border:none;}
  .hk-row.found{opacity:.38;text-decoration:line-through;}
  .hk-ans-wrap{flex:1;display:flex;flex-direction:column;gap:1px;}
  .hk-ans{color:#c7e3ff;font-weight:700;}
  .hk-desc{font-size:11px;color:var(--muted);font-weight:400;}
  .hk-pts{color:var(--gold);font-weight:900;min-width:28px;text-align:right;font-size:15px;}
  .hk-num{color:var(--muted);font-weight:800;min-width:18px;padding-top:1px;}

  /* ── SLIDE NOTES ── */
  .slide-notes{background:#1a0d00;border:1px solid #7c3a0a;border-radius:12px;overflow:hidden;}
  .sn-toggle{width:100%;background:transparent;border:none;color:#f59e0b;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;}
  .sn-toggle:hover{background:#200f00;}
  .sn-body{display:none;padding:10px 14px 12px;border-top:1px solid #7c3a0a;}
  .sn-body.open{display:block;}
  .sn-body ul{padding-left:16px;display:flex;flex-direction:column;gap:6px;}
  .sn-body li{font-size:12px;color:#fcd34d;line-height:1.5;}
  .sn-body li strong{color:#fef3c7;}

  /* ── CONTROLS ── */
  .ctrl{background:#06192b;border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;}
  .btn{border:none;border-radius:10px;padding:10px 16px;font-weight:800;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .08s,filter .15s;}
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(2px);box-shadow:none;}
  .btn-reveal{background:linear-gradient(180deg,#ffe28a,var(--gold));color:#06202f;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none;}
  .btn-ghost:hover{background:#0e2c47;color:var(--txt);}
  .btn-next{background:linear-gradient(180deg,var(--green),var(--green2));color:#052e16;}

  /* ── OVERLAYS ── */
  .overlay{position:fixed;inset:0;background:rgba(2,9,18,.85);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .overlay.show{display:flex;}
  .modal{width:min(580px,96vw);background:linear-gradient(180deg,#0f3a63,#0a2641);border:1px solid var(--blue-border);border-radius:18px;padding:28px 32px;text-align:center;animation:pop .22s ease;}
  @keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h2{font-size:clamp(20px,3.5vw,32px);font-weight:900;color:var(--gold);margin-bottom:6px;}
  .modal .sub{color:var(--muted);font-size:14px;margin-bottom:20px;}
  .ss-row{display:flex;gap:12px;justify-content:center;margin-bottom:20px;}
  .ss{flex:1;background:#06192b;border:1px solid var(--line);border-radius:12px;padding:14px;}
  .ss .ssn{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;}
  .ss .ssp{font-size:32px;font-weight:900;}
  .ss.s1 .ssp{color:var(--team1);}
  .ss.s2 .ssp{color:var(--team2);}
  .ss.winner{border-width:2px;}
  .ss.s1.winner{border-color:var(--team1);}
  .ss.s2.winner{border-color:var(--team2);}
  .modal-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  @media(max-width:720px){
    .gbody{grid-template-columns:1fr;gap:12px;}
    .tp{position:static;display:flex;align-items:center;gap:10px;text-align:left;}
    .tp .tscore{font-size:28px;}
    .tbadge{margin:0;}
    .board{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<!-- ══ MENU ══ -->
<div id="menuScreen" class="screen active">
  <div class="mhead">
    <span class="kicker">Carbon Clash · EcoRise Camp</span>
    <h1>SAVING CARBON TOWN</h1>
    <p>Family Feud Edition · pick a game to start</p>
  </div>
  <div class="ggrid" id="ggrid"></div>
</div>

<!-- ══ GAME ══ -->
<div id="gameScreen" class="screen">
  <div class="ghdr">
    <button class="btn-back" id="backBtn">← Menu</button>
    <div class="gtitle" id="hTitle">—</div>
    <div class="grnd" id="hRound">Round 1 of 3</div>
  </div>

  <div class="gbody">
    <!-- Team 1 -->
    <div class="tp" id="tp1">
      <div class="tlbl">Team 1</div>
      <span class="tname" id="tn1" contenteditable spellcheck="false">City Council A</span>
      <div class="tscore t1score" id="ts1">0</div>
      <div class="trnd" id="tr1">+0 this round</div>
      <div class="tbadge b1">▶ Guessing</div>
      <div class="tbadge b2" style="display:none"></div>
    </div>

    <!-- Center -->
    <div class="center">
      <div class="qbox">
        <div class="qlbl">Question</div>
        <div class="qtxt" id="qText">—</div>
      </div>

      <div class="input-area">
        <div class="input-label" id="inputLabel">Waiting…</div>
        <div class="input-row">
          <input type="text" id="answerInput" placeholder="Type the team's answer…" autocomplete="off" />
          <button class="submit-btn" id="submitBtn">Submit</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="board" id="board"></div>

      <div class="strikes-row">
        <span class="slbl">Strikes</span>
        <div class="smarks">
          <div class="sm" id="sm0"></div>
          <div class="sm" id="sm1"></div>
          <div class="sm" id="sm2"></div>
        </div>
      </div>

      <div class="host-key">
        <button class="hk-toggle" id="hkToggle">
          <span>🔑 Host Answer Key</span><span id="hkArrow">▼</span>
        </button>
        <div class="hk-body" id="hkBody"></div>
      </div>

      <div class="slide-notes" id="slideNotesWrap" style="display:none">
        <button class="sn-toggle" id="snToggle">
          <span>⚠️ Slide Coverage Notes</span><span id="snArrow">▼</span>
        </button>
        <div class="sn-body" id="snBody"></div>
      </div>
    </div>

    <!-- Team 2 -->
    <div class="tp" id="tp2">
      <div class="tlbl">Team 2</div>
      <span class="tname" id="tn2" contenteditable spellcheck="false">City Council B</span>
      <div class="tscore t2score" id="ts2">0</div>
      <div class="trnd" id="tr2">+0 this round</div>
      <div class="tbadge b1" style="display:none"></div>
      <div class="tbadge b2">▶ Guessing</div>
    </div>
  </div>

  <div class="ctrl">
    <button class="btn btn-reveal" id="btnReveal">Reveal All &amp; End Round</button>
    <button class="btn btn-ghost" id="btnSkip">Skip Question (no points)</button>
  </div>
</div>

<!-- Round over -->
<div class="overlay" id="roOverlay">
  <div class="modal">
    <h2 id="roTitle">Round Over!</h2>
    <div class="sub" id="roSub">Scores updated.</div>
    <div class="ss-row" id="roScores"></div>
    <div class="modal-btns">
      <button class="btn btn-next" id="btnRoNext">Next Question →</button>
      <button class="btn btn-ghost" id="btnRoMenu">← Menu</button>
    </div>
  </div>
</div>

<!-- Game over -->
<div class="overlay" id="goOverlay">
  <div class="modal">
    <h2>Game Over!</h2>
    <div class="sub" id="goSub">Final scores:</div>
    <div class="ss-row" id="goScores"></div>
    <div class="modal-btns">
      <button class="btn btn-reveal" id="btnGoMenu">← Back to Menu</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   GAME DATA
   Points are grounded in real data — the host
   key shows exactly what each number means.
   ═══════════════════════════════════════════ */
const GAMES = [
  {
    title:"Overview & Storage", color:"#22d3a8",
    desc:"Overview and Storage slides",
    notes:[
      {q:null, txt:"Ensure slides explicitly list all 5 main carbon stores: <strong>soil, ocean, trees/forests, atmosphere, fossil fuels</strong>."},
      {q:null, txt:"Ensure slides name all 4 carbon cycle steps: <strong>photosynthesis, decomposition, respiration, absorption</strong>."},
      {q:"Q2",  txt:"<strong>'Absorption'</strong> as a named cycle step may not be on slides — add it if missing."},
      {q:"Q3",  txt:"<strong>Wetlands/bogs</strong> as carbon stores are covered in the Sinks unit — worth a brief mention in Storage too."},
    ],
    questions:[
      { q:"Name somewhere on Earth where carbon is stored.",
        metric:"Points = % of Earth's total active carbon (~44,000 Gt C)",
        answers:[
          {t:"Ocean / Sea",       p:86, d:"~38,000 Gt C = 86% of all active carbon"},
          {t:"Fossil Fuels",      p: 9, d:"~4,000 Gt C  = 9%"},
          {t:"Soil / Underground",p: 3, d:"~1,500 Gt C  = 3%"},
          {t:"Atmosphere",        p: 2, d:"~860 Gt C    = 2%"},
          {t:"Trees / Forests",   p: 1, d:"~550 Gt C    = 1%"},
        ]},
      { q:"Name a step in the carbon cycle.",
        metric:"Points = annual gross carbon flux (Gt C/yr), normalised to 100",
        answers:[
          {t:"Photosynthesis",          p:40, d:"moves ~120 Gt C/yr out of the atmosphere"},
          {t:"Ocean Absorption",        p:30, d:"gross ocean–atmosphere exchange ~90 Gt C/yr"},
          {t:"Respiration / Breathing", p:20, d:"all organisms release ~60 Gt C/yr"},
          {t:"Decomposition",           p:10, d:"dead matter releases ~30 Gt C/yr"},
        ]},
      { q:"Name something that makes a good long-term carbon store.",
        metric:"Points = storage quality (size × stability), ocean=50 baseline",
        answers:[
          {t:"Ocean",        p:50, d:"38,000 Gt C locked in stable deep-ocean layers"},
          {t:"Soil",         p:25, d:"1,500+ Gt C; centuries-long residence time"},
          {t:"Wetland / Bog",p:15, d:"peat preserves carbon for thousands of years; 10× density of ordinary land"},
          {t:"Forest / Trees",p: 8, d:"~550 Gt C; decades–centuries before it releases"},
          {t:"Atmosphere",   p: 2, d:"860 Gt C but NOT a good store — this is where we need less carbon"},
        ]},
    ]
  },
  {
    title:"Sinks", color:"#3b82f6",
    desc:"Ocean / Blue Carbon, Forests / Wetlands slides",
    notes:[
      {q:null, txt:"Ensure slides cover ocean, forests, wetlands, mangroves, and seagrass as distinct sinks."},
      {q:"Q2",  txt:"<strong>Salt marshes</strong> as a blue carbon ecosystem may not be explicitly named on slides — add it."},
      {q:"Q3",  txt:"The <strong>26% CO₂ absorption stat</strong> and <strong>phytoplankton's role</strong> should appear on slides. Add if missing."},
    ],
    questions:[
      { q:"Name a natural carbon sink.",
        metric:"Points = % of total annual natural carbon sequestration (~5 Gt C/yr)",
        answers:[
          {t:"Ocean",               p:50, d:"absorbs ~2.5 Gt C/yr = 50% of all natural sinks"},
          {t:"Forest",              p:40, d:"land forests absorb ~2.0 Gt C/yr = 40%"},
          {t:"Wetland / Peatland",  p: 7, d:"~0.37 Gt C/yr = 7%"},
          {t:"Mangroves",           p: 2, d:"~0.02–0.05 Gt C/yr = 2% (but very high per hectare!)"},
          {t:"Seagrass",            p: 1, d:"~0.02 Gt C/yr = 1% (but highest per-hectare efficiency of all)"},
        ]},
      { q:"Name a type of 'blue carbon' ecosystem.",
        metric:"Points = carbon sequestration efficiency vs typical land (1× = ordinary land)",
        answers:[
          {t:"Seagrass meadows",p:40, d:"locks carbon 40× faster per hectare than typical land (per curriculum)"},
          {t:"Salt marshes",    p: 8, d:"stores ~8× more carbon per hectare than ordinary land"},
          {t:"Mangroves",       p: 4, d:"captures 4× more carbon per hectare than a normal forest (per curriculum)"},
        ]},
      { q:"Name a reason the ocean is Earth's biggest carbon sink.",
        metric:"Points = annual Gt C contribution of each mechanism",
        answers:[

/* ═══════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════ */
let S = {};
function initState(gIdx) {
  S = { g:gIdx, q:0, revealed:new Set(), owner:{}, strikes:0, active:1, phase:'play', scores:[0,0], roundScores:[0,0] };
}

/* ═══════════════════════════════════════════
   ANSWER MATCHING
   ═══════════════════════════════════════════ */
function clean(s) {
  return s.replace(/₂/g,'2').replace(/co2/gi,'co2').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function findMatch(input) {
  const inp = clean(input);
  if (inp.length < 2) return -1;
  const q = GAMES[S.g].questions[S.q];
  for (let i = 0; i < q.answers.length; i++) {
    if (S.revealed.has(i)) continue;
    const variants = q.answers[i].t.split('/').map(v => clean(v));
    for (const v of variants) {
      if (!v || v.length < 2) continue;
      if (v === inp) return i;
      if (inp.length >= 3 && v.includes(inp)) return i;
      if (v.length >= 3 && inp.includes(v)) return i;
    }
  }
  return -1;
}

/* ═══════════════════════════════════════════
   MENU
   ═══════════════════════════════════════════ */
GAMES.forEach((g, i) => {
  const el = document.createElement('div');
  el.className = 'gcard'; el.style.setProperty('--c', g.color);
  el.innerHTML = `<div class="gn">Game ${i+1}</div><h2>${g.title}</h2><p>${g.desc}</p><div class="qc">${g.questions.length} questions</div>`;
  el.onclick = () => startGame(i);
  document.getElementById('ggrid').appendChild(el);
});

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ═══════════════════════════════════════════
   GAME START / ROUND
   ═══════════════════════════════════════════ */
function startGame(idx) {
  initState(idx);
  document.getElementById('hTitle').textContent = GAMES[idx].title;
  showScreen('gameScreen');
  renderRound();
}

function renderRound() {
  const g = GAMES[S.g], q = g.questions[S.q];
  S.revealed = new Set(); S.owner = {}; S.strikes = 0; S.phase = 'play';
  S.roundScores = [0, 0];

  document.getElementById('hRound').textContent = `Round ${S.q+1} of ${g.questions.length}`;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('answerInput').value = '';
  document.getElementById('answerInput').disabled = false;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  // Board tiles
  const board = document.getElementById('board');
  board.innerHTML = '';
  q.answers.forEach((a, i) => {
    const tw = document.createElement('div');
    tw.className = 'tw'; tw.dataset.i = i;
    tw.innerHTML = `<div class="ti"><div class="tf">${i+1}</div><div class="tb"><div class="atxt">${a.t}</div><div class="apts">${a.p} pts</div><div class="owner-tag" id="ot${i}"></div></div></div>`;
    board.appendChild(tw);
  });

  // Host key
  buildHostKey();
  // Slide notes
  buildSlideNotes();

  updateStrikes(); updatePanels(); updateInputLabel();
  document.getElementById('answerInput').focus();
}

/* ═══════════════════════════════════════════
   GUESSING
   ═══════════════════════════════════════════ */
function submitGuess() {
  if (S.phase !== 'play') return;
  const input = document.getElementById('answerInput');
  const val = input.value.trim();
  if (!val) return;

  const idx = findMatch(val);
  input.value = '';

  if (idx !== -1) {
    // Correct!
    revealTile(idx, S.active);
    const pts = GAMES[S.g].questions[S.q].answers[idx].p;
    S.roundScores[S.active-1] += pts;

    showFeedback(`✓ "${GAMES[S.g].questions[S.q].answers[idx].t}" — +${pts} pts for ${teamName(S.active)}!`, 'match');
    input.classList.add('right-flash');
    setTimeout(() => input.classList.remove('right-flash'), 600);

    const allRevealed = S.revealed.size === GAMES[S.g].questions[S.q].answers.length;
    switchTeam();
    updatePanels();
    updateHostKey();
    if (allRevealed) { endRound(); return; }
  } else {
    // Wrong
    S.strikes++;
    showFeedback(`✗ No match — Strike ${S.strikes} of 3`, 'miss');
    input.classList.add('wrong-shake');
    setTimeout(() => input.classList.remove('wrong-shake'), 400);
    updateStrikes();

    if (S.strikes >= 3) {
      showFeedback('✗✗✗ Three strikes — revealing remaining answers!', 'miss');
      document.getElementById('answerInput').disabled = true;
      setTimeout(() => { revealRemaining(); endRound(); }, 1200);
      return;
    }
    switchTeam();
    updatePanels();
  }
  updateInputLabel();
  setTimeout(() => document.getElementById('answerInput').focus(), 50);
}

function switchTeam() { S.active = S.active === 1 ? 2 : 1; }

function revealTile(idx, team) {
  S.revealed.add(idx);
  S.owner[idx] = team;
  const tw = document.querySelector(`.tw[data-i="${idx}"]`);
  tw.classList.add('revealed');
  const tag = document.getElementById('ot'+idx);
  if (tag) {
    tag.textContent = `T${team}`;
    tag.className = `owner-tag owner-t${team}`;
  }
}

function revealRemaining() {
  const q = GAMES[S.g].questions[S.q];
  q.answers.forEach((_, i) => {
    if (!S.revealed.has(i)) {
      S.revealed.add(i);
      const tw = document.querySelector(`.tw[data-i="${i}"]`);
      tw.classList.add('revealed', 'no-owner');
    }
  });
  updateHostKey();
}

/* ═══════════════════════════════════════════
   ROUND END
   ═══════════════════════════════════════════ */
function endRound() {
  S.phase = 'done';
  document.getElementById('answerInput').disabled = true;
  // Add round scores to totals
  S.scores[0] += S.roundScores[0];
  S.scores[1] += S.roundScores[1];
  updatePanels();

  const label = document.getElementById('inputLabel');
  label.style.color = 'var(--teal)';
  label.textContent = 'Round complete!';

  // Delay so players can see the last revealed tile
  setTimeout(() => {
    const isLast = S.q >= GAMES[S.g].questions.length - 1;
    document.getElementById('roTitle').textContent = 'Round Over!';
    document.getElementById('roSub').textContent =
      `${teamName(1)} earned ${S.roundScores[0]} pts · ${teamName(2)} earned ${S.roundScores[1]} pts`;
    renderScoreSummary('roScores');
    document.getElementById('btnRoNext').textContent = isLast ? 'See Final Scores →' : 'Next Question →';
    document.getElementById('roOverlay').classList.add('show');
    label.style.color = '';
  }, 1800);
}

function nextQuestion() {
  document.getElementById('roOverlay').classList.remove('show');
  S.q++;
  if (S.q >= GAMES[S.g].questions.length) { showGameOver(); return; }
  S.active = S.active === 1 ? 2 : 1; // alternate who goes first next round
  renderRound();
}

function showGameOver() {
  const [s1,s2] = S.scores;
  document.getElementById('goSub').textContent = s1>s2 ? `🏆 ${teamName(1)} wins!` : s2>s1 ? `🏆 ${teamName(2)} wins!` : "It's a tie!";
  renderScoreSummary('goScores');
  document.getElementById('goOverlay').classList.add('show');
}

/* ═══════════════════════════════════════════
   UI HELPERS
   ═══════════════════════════════════════════ */
function updateStrikes() {
  for (let i=0;i<3;i++) {
    const el=document.getElementById('sm'+i);
    el.classList.toggle('hit', i<S.strikes);
    el.textContent = i<S.strikes ? '✗' : '';
  }
}

function updatePanels() {
  const tp1=document.getElementById('tp1'), tp2=document.getElementById('tp2');
  tp1.classList.toggle('t1-active', S.active===1 && S.phase==='play');
  tp2.classList.toggle('t2-active', S.active===2 && S.phase==='play');
  document.getElementById('ts1').textContent = S.scores[0].toLocaleString();
  document.getElementById('ts2').textContent = S.scores[1].toLocaleString();
  document.getElementById('tr1').textContent = `+${S.roundScores[0]} this round`;
  document.getElementById('tr2').textContent = `+${S.roundScores[1]} this round`;
}

function updateInputLabel() {
  const lbl = document.getElementById('inputLabel');
  const name = teamName(S.active);
  const color = S.active === 1 ? 'var(--team1)' : 'var(--team2)';
  lbl.innerHTML = `<span style="color:${color}">${name}</span> is guessing`;
}

function showFeedback(msg, cls) {
  const el = document.getElementById('feedback');
  el.textContent = msg; el.className = 'feedback ' + cls;
}

function teamName(t) { return document.getElementById('tn'+t).textContent.trim() || `Team ${t}`; }

function renderScoreSummary(cid) {
  const [s1,s2] = S.scores;
  document.getElementById(cid).innerHTML = [0,1].map(i => {
    const win = S.scores[i] > S.scores[1-i];
    return `<div class="ss s${i+1}${win?' winner':''}"><div class="ssn">${teamName(i+1)}</div><div class="ssp">${S.scores[i].toLocaleString()}</div></div>`;
  }).join('');
}

/* ═══════════════════════════════════════════
   HOST KEY
   ═══════════════════════════════════════════ */
function buildHostKey() {
  const q = GAMES[S.g].questions[S.q];
  const body = document.getElementById('hkBody');
  const metricLine = q.metric ? `<div class="hk-metric">${q.metric}</div>` : '';
  body.innerHTML = metricLine + q.answers.map((a,i) =>
    `<div class="hk-row${S.revealed.has(i)?' found':''}" id="hkr${i}">
      <span class="hk-num">${i+1}.</span>
      <div class="hk-ans-wrap"><span class="hk-ans">${a.t}</span>${a.d?`<span class="hk-desc">${a.d}</span>`:''}</div>
      <span class="hk-pts">${a.p}</span>
    </div>`
  ).join('');
}
function updateHostKey() {
  GAMES[S.g].questions[S.q].answers.forEach((_, i) => {
    const row = document.getElementById('hkr'+i);
    if (row) row.classList.toggle('found', S.revealed.has(i));
  });
}

/* ═══════════════════════════════════════════
   SLIDE NOTES
   ═══════════════════════════════════════════ */
function buildSlideNotes() {
  const g = GAMES[S.g];
  const qLabel = `Q${S.q+1}`;
  // Show notes relevant to this game (global) or this specific question
  const relevant = g.notes.filter(n => !n.q || n.q === qLabel);
  const wrap = document.getElementById('slideNotesWrap');
  const body = document.getElementById('snBody');
  if (!relevant.length) { wrap.style.display='none'; return; }
  wrap.style.display = '';
  body.innerHTML = `<ul>${relevant.map(n=>`<li>${n.q?`<strong>[${n.q}]</strong> `:''} ${n.txt}</li>`).join('')}</ul>`;
}

/* ═══════════════════════════════════════════
   COLLAPSIBLE TOGGLES
   ═══════════════════════════════════════════ */
document.getElementById('hkToggle').onclick = () => {
  const body=document.getElementById('hkBody'), arrow=document.getElementById('hkArrow');
  const open=body.classList.toggle('open');
  arrow.textContent=open?'▲':'▼';
};
document.getElementById('snToggle').onclick = () => {
  const body=document.getElementById('snBody'), arrow=document.getElementById('snArrow');
  const open=body.classList.toggle('open');
  arrow.textContent=open?'▲':'▼';
};

/* ═══════════════════════════════════════════
   BUTTON WIRING
   ═══════════════════════════════════════════ */
document.getElementById('submitBtn').onclick = submitGuess;
document.getElementById('answerInput').onkeydown = e => { if(e.key==='Enter') submitGuess(); };

document.getElementById('btnReveal').onclick = () => {
  if (S.phase==='done') return;
  revealRemaining();
  endRound();
};

document.getElementById('btnSkip').onclick = () => {
  if (S.phase==='done') return;
  if (!confirm('Skip this question? No points awarded.')) return;
  revealRemaining();
  S.phase = 'done';
  document.getElementById('answerInput').disabled = true;
  const isLast = S.q >= GAMES[S.g].questions.length - 1;
  document.getElementById('roTitle').textContent = 'Question Skipped';
  document.getElementById('roSub').textContent = 'No points awarded.';
  S.scores[0] += S.roundScores[0]; S.scores[1] += S.roundScores[1];
  renderScoreSummary('roScores');
  document.getElementById('btnRoNext').textContent = isLast ? 'See Final Scores →' : 'Next Question →';
  document.getElementById('roOverlay').classList.add('show');
};

document.getElementById('btnRoNext').onclick = nextQuestion;
document.getElementById('btnRoMenu').onclick = () => { document.getElementById('roOverlay').classList.remove('show'); showScreen('menuScreen'); };
document.getElementById('btnGoMenu').onclick = () => { document.getElementById('goOverlay').classList.remove('show'); showScreen('menuScreen'); };
document.getElementById('backBtn').onclick = () => { if(confirm('Go back to menu? Scores will be lost.')) showScreen('menuScreen'); };
</script>
